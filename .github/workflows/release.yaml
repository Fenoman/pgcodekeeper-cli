name: Release Workflow

on:
  push:
    tags:
      - 'v*.*.*'

env:
  # single source of truth for the matching pgcodekeeper-core commit;
  # README build instructions read this value instead of repeating it
  CORE_REF: e61d3417c6a65247c190d9f34d843d5863144ccf

jobs:
  build:
    runs-on: macos-latest
    steps:

      - name: checkout
        uses: actions/checkout@v6

      - name: checkout matching core release
        uses: actions/checkout@v6
        with:
          repository: Fenoman/pgcodekeeper-core
          ref: ${{ env.CORE_REF }}
          path: pgcodekeeper-core
          persist-credentials: false

      - name: set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: build core
        run: >-
          mvn -B -ntp -f pgcodekeeper-core/pom.xml clean install -DskipTests
          -Dmaven.repo.local="${{ runner.temp }}/pgck-release-m2/repository"

      - name: build
        run: >-
          mvn -B -ntp clean verify
          -Dmaven.repo.local="${{ runner.temp }}/pgck-release-m2/repository"

      - name: set version
        run: echo "RELEASE_VERSION=$(echo ${GITHUB_REF#refs/*/} | cut -c 2-)" >> $GITHUB_ENV

      - name: set cli build name for zip
        run: echo "CLI_BUILD_ZIP=pgcodekeeper-cli-${{ env.RELEASE_VERSION }}.zip" >> $GITHUB_ENV

      - name: set cli build name for jar
        run: echo "CLI_BUILD_JAR=pgcodekeeper-cli-${{ env.RELEASE_VERSION }}.jar" >> $GITHUB_ENV

      - name: upload release assets
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b #v3.0.1
        with:
          tag_name: v${{ env.RELEASE_VERSION }}
          name: pgCodeKeeper ${{ env.RELEASE_VERSION }}
          draft: false
          prerelease: false
          files: |
            ${{ github.workspace }}/target/${{ env.CLI_BUILD_ZIP }}
            ${{ github.workspace }}/target/${{ env.CLI_BUILD_JAR }}
