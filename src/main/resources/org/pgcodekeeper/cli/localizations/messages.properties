Batch_section_output = output "%s"

Batch_summary_failed = batch output '%s': FAILED - %s

Batch_summary_ok = batch output '%s': OK -> %s

CliArgs_Help = show this help

CliArgs_Version = show version

CliArgs_add_transaction = wrap generated script with transaction statements

CliArgs_allow_danger_ddl = allows dangerous statements in safe-mode scripts

CliArgs_allowed_object = build the script using these object types only, hide statements of other objects

CliArgs_batch_manifest = path to a JSON batch manifest: shared load arguments plus several outputs\ngenerated from a single loaded comparison\neach output is byte-identical to a standalone run with common + output args\nfailed outputs do not stop the others and are reported on stderr (BATCH mode only)

CliArgs_clear_lib_cache = clear library cache

CliArgs_cluster_name = the name of the cluster that will be applied to all tables (experimentally, only for ClickHouse)

CliArgs_comments_to_end = print comments at the end of the script

CliArgs_concurrently_mode = print CREATE INDEX with CONCURRENTLY option for PostgreSQL and WITH ONLINE = ON for MS SQL

CliArgs_db_type = specify database type for work: PG, MS, CH

CliArgs_deps_file = add a file with a list of additional dependencies

CliArgs_disable_auto_load = disable automatic loading of project auxiliary files

CliArgs_drop_before_create = print DROP before CREATE statement

CliArgs_enable_function_bodies_dependencies = enable dependencies from bodies of functions and procedures to other functions or procedures

CliArgs_error_argument_null = Please specify argument %s

CliArgs_error_batch_manifest_required = Please specify --batch-manifest in BATCH mode.

CliArgs_error_concurrently_mode_wrong_option = --concurrently-mode (-C) cannot be used with the option(s) --add-transaction (-X) for PostgreSQL.

CliArgs_error_conflicting_options = option "%s" cannot be used with the option(s) [%s]

CliArgs_error_jdbc_fetch_size_negative = JDBC fetch size must not be negative.

CliArgs_error_pg_catalog_cache_max_mb_non_positive = PostgreSQL catalog cache size limit must be positive.

CliArgs_error_pg_parallel_catalog_readers_negative = PostgreSQL parallel catalog reader count must not be negative.

CliArgs_error_project_file_filter = Failed to read project file filter "%s": %s

CliArgs_error_pg_routine_body_residual_batch_bytes_non_positive = PostgreSQL residual routine body batch byte budget must be positive.

CliArgs_error_pg_routine_body_residual_batch_count_non_positive = PostgreSQL residual routine body batch count must be positive.

CliArgs_error_run_on_non_jdbc = Option --run-on (-R) must specify JDBC connection string.

CliArgs_error_source_dest = Please specify both SOURCE and DEST.

CliArgs_error_source_null = Please specify SOURCE.

CliArgs_error_space_joined_option = Argument "%s" joins option "%s" and its value in one token: pass them as separate arguments, or join them with '='.

CliArgs_error_structure_file_with_update = --structure-file cannot be used with --update-project.

CliArgs_error_target_non_db = Script can be applied only to database.

CliArgs_error_wrong_db_type = %s cannot be used with --db-type %s option

CliArgs_error_wrong_mode = %s cannot be used with --mode %s option

CliArgs_generate_constraint_not_valid = print CONSTRAINT NOT VALID for no partitioned tables

CliArgs_generate_exist = print CREATE IF NOT EXISTS / DROP IF EXISTS

CliArgs_generate_exist_do_block = print creation of CONSTRAINT and IDENTITY in DO block (PG only)

CliArgs_graph_depth = depth of displayed dependencies in graph mode

CliArgs_graph_filter_object = show these object types, hide other objects types

CliArgs_graph_invert_filter = invert graph filter object types: hide objects specified by the filter

CliArgs_graph_name = name of start object in graph mode\nspecify multiple times to use several names

CliArgs_graph_reverse = reverse the direction of the graph to show objects on which the starting object depends

CliArgs_ignore_column_order = ignore differences in table column order

CliArgs_ignore_column_statistics = ignore the statistics target of columns (attstattarget) when comparing; CREATE STATISTICS objects are unaffected

CliArgs_ignore_concurrent_modification = ignore concurrent modification errors of database objects

CliArgs_ignore_errors = do not stop on parse errors

CliArgs_ignore_list = use an ignore list to include/exclude objects from diff\nspecify multiple times to use several lists

CliArgs_ignore_schema = use an ignore schema list to include/exclude schemas at loading stage

CliArgs_ignore_sequence_cache = ignore the CACHE parameter of sequences when comparing

CliArgs_in_charset = input charset

CliArgs_jdbc_fetch_size = JDBC catalog fetch size; 0 keeps the driver default (default: 512)

CliArgs_keep_newlines = keep newline characters as is (don't convert to Unix newlines)

CliArgs_lib_safe_mode = exit with an error if a library object conflicts with other schema or library objects\notherwise, in case of conflicts objects loaded first have priority

CliArgs_list_charsets = show list of Java-supported charsets

CliArgs_migrate_data = migrate data when re-creating tables

CliArgs_mode = specify mode:\nDIFF - to compares the two sources and generates a migration script;\nPARSE - to save database schema as a directory hierarchy;\nGRAPH - to search for dependencies of an object;\nBATCH - to generate several migration scripts from one loaded comparison, see --batch-manifest;\n

CliArgs_no_alter_table_only = write ALTER TABLE without ONLY, so changes reach inheritance children and TimescaleDB hypertables accept them

CliArgs_no_check_function_bodies = set check_function_bodies to false at the beginning of the script

CliArgs_no_parallel_load = load the comparison sides sequentially (rollback switch for the --parallel-load default); also turns the hash-first routine body default off

CliArgs_no_privileges = ignore privileges and owners of database objects

CliArgs_out_charset = output charset

CliArgs_output = script output file or parser output directory

CliArgs_pg_catalog_cache_dir = persistent local cache directory for PostgreSQL routine bodies fetched on the hash-first path; repeat comparisons skip downloading unchanged bodies

CliArgs_pg_catalog_cache_max_mb = size cap of the PostgreSQL catalog cache in megabytes; oldest entries are pruned after a run

CliArgs_pg_catalog_cache_rows = additionally cache whole PostgreSQL catalog reader rows keyed by a server-side row hash; repeat comparisons transfer only changed rows

CliArgs_pg_parallel_catalog_readers = read PostgreSQL catalogs with N extra connections sharing the primary snapshot; 0 keeps the sequential flow; loads that cannot share the snapshot fall back to sequential reading (CLI default: 3; the core/IDE default stays 0)

CliArgs_pg_routine_body_hash_first = reuse matching PostgreSQL routine bodies from the project and fetch only residual bodies (default for PostgreSQL DIFF mode; this flag is a no-op kept for script compatibility, see --pg-routine-body-no-hash-first)

CliArgs_pg_routine_body_no_skip_matched_analysis = always analyze and fetch database routine bodies (rollback switch); by default late-bound bodies (plpgsql, or quoted sql with --no-check-function-bodies) skip dependency analysis on the hash-first path: bodies byte-identical between project and database skip on both sides, and every eligible body of the database acting as the old comparison side skips regardless of the match, with unmatched old-side bodies not even fetched; such functions lose collateral recreates in drop cascades; changed project bodies are always analyzed

CliArgs_pg_routine_body_no_hash_first = always fetch full PostgreSQL routine bodies from the database (rollback switch for the hash-first default); cannot be combined with the hash-first-only options --pg-routine-body-residual-batch-count, --pg-routine-body-residual-batch-bytes and --pg-catalog-cache-dir

CliArgs_pg_routine_body_residual_batch_bytes = predicted UTF-8 grouping budget for each PostgreSQL residual routine body batch; one oversized body is fetched alone (default: 33554432)

CliArgs_pg_routine_body_residual_batch_count = maximum PostgreSQL residual routine bodies per JDBC batch (default: 256)

CliArgs_post_script = POST script file path or directory with POST scripts\nnested directories are loaded recursively\nspecify multiple times to use several paths

CliArgs_pre_script = PRE script file path or directory with PRE scripts\nnested directories are loaded recursively\nspecify multiple times to use several paths

CliArgs_project_file_filter = filter top-level project files using ordered rules from a UTF-8 file (opt-in)

CliArgs_run_on = run generated script on the specified database

CliArgs_run_on_target = run generated script on the target database

CliArgs_safe_mode = do not generate scripts containing dangerous statements\nsee: --allow-danger-ddl

CliArgs_selected_only = build the script using 'selected' objects only, hide statements of other objects\nin CLI, selected means included by --allowed-object and ignore lists

CliArgs_show_error = print exception stacktrace

CliArgs_simplify_not_null = simplified reading of NOT NULL constraints via JDBC (only for PostgreSQL 18+)

CliArgs_simplify_views = simple formatting for VIEWs when reading via JDBC (not recomended by PostgreSQL)

CliArgs_source = source of schema changes

CliArgs_src_lib = add library to source\nspecify multiple times to use several libraries

CliArgs_src_lib_no_priv = add library to source without privileges\nspecify multiple times to use several libraries

CliArgs_src_lib_xml = add xml with libraries to source\nspecify multiple times to use several libraries xml's

CliArgs_stop_not_allowed = exit with an error when --allowed-object hides a dependency statement from the script

CliArgs_structure_file = path to a properties file with directory layout overrides for parse mode

CliArgs_target = destination for schema changes (diff mode only)

CliArgs_tgt_lib = add library to destination\nspecify multiple times to use several libraries

CliArgs_tgt_lib_no_priv = add library to destination without privileges\nspecify multiple times to use several libraries

CliArgs_tgt_lib_xml = add xml with libraries to target\nspecify multiple times to use several libraries xml's

CliArgs_time_zone = use this timezone when working with database, also add SET TIMEZONE statement to the script

CliArgs_update_project = update an existing project in parse mode

CliArgs_use_actual_syntax = use the current syntax to generate the migration script (currently not implemented)

CliArgs_use_parallel_load = use parallel database loading (default; this flag is a no-op kept for script compatibility, see --no-parallel-load)

CliArgs_using_off = do not print USING expression for ALTER COLUMN TYPE

Main_cach_clear = Library cache cleared

Main_danger_statements = Script contains dangerous statements: %s. Use --allow-danger-ddl to override.

Main_log_apply_migration_script = Apply migration script on target database

Main_log_build_graph_deps = Building graph dependencies

Main_log_cache_dir_absent = absent

Main_log_cache_mode = Effective PostgreSQL cache mode: catalog cache dir %s, size cap %d MB, row cache %b, hash-first %b

Main_log_contains_dangerous_statements = Migration script contains dangerous statements: %s

Main_log_create_script = Starting creating script

Main_log_running_error = Got error when application running

Main_log_start_export_proj = Start to export project

Main_log_start_update_proj = Start to update project

Main_log_succes_finish = Successfully completed

Main_show_stacktrace = Use -E to see exception stacktrace

